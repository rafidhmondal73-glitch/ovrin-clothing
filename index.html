<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovrin | Wear Your Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ovrin-red: #cc0000;
            --bg-dark: #070707;
            --card-bg: #111111;
            --text-main: #f5f5f5;
            --text-muted: #888;
            --glass-bg: rgba(10, 10, 10, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-dark); 
            color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        /* --- Navbar & Marquee --- */
        nav {
            position: fixed; top: 0; width: 100%; background: var(--glass-bg);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;
        }
        #nav-logo { height: 40px; width: auto; transition: transform 0.3s; }
        #nav-logo:hover { transform: scale(1.05); }
        .marquee-container {
            background-color: var(--ovrin-red); color: var(--bg-dark); padding: 10px 0;
            overflow: hidden; white-space: nowrap; display: flex; align-items: center;
            font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-top: 75px;
        }
        .marquee-content { display: inline-block; animation: marquee 15s linear infinite; }
        .marquee-content span { margin: 0 2rem; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- Hero --- */
        .hero { text-align: center; margin: 5rem auto 4rem; max-width: 800px; padding: 0 1rem; }
        .hero h1 { font-size: 4rem; font-weight: 700; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 1rem; }
        .highlight { color: var(--ovrin-red); text-shadow: 0 0 30px rgba(204, 0, 0, 0.3); }

        /* --- Dynamic Products Grid --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .products { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem; margin-bottom: 8rem; min-height: 400px;
        }

        /* Loading Spinner */
        .loader {
            grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; height: 200px;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--ovrin-red); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Product Cards */
        .product-card { 
            background: var(--card-bg); border: 1px solid #1a1a1a; border-radius: 12px; 
            overflow: hidden; position: relative; transition: all 0.4s ease;
            opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .product-card:hover { border-color: #333; transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        .badge {
            position: absolute; top: 15px; left: 15px; background: var(--ovrin-red); color: white;
            padding: 5px 12px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 4px; z-index: 10;
        }
        .image-container { width: 100%; height: 400px; background-color: #0a0a0a; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease; }
        .product-card:hover img { transform: scale(1.05); }
        
        .product-info { padding: 2rem; }
        .product-card h3 { font-size: 1.5rem; margin-bottom: 0.3rem; font-weight: 700; }
        .fit-tag { font-size: 0.8rem; color: var(--ovrin-red); margin-bottom: 1rem; font-weight: 600; text-transform: uppercase; }
        .sizes { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .size-box { border: 1px solid #333; padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; color: var(--text-muted); }
        .price-row { display: flex; justify-content: space-between; align-items: center; }
        .price { font-weight: 700; font-size: 1.4rem; }
        button.action-btn { 
            background: var(--text-main); color: var(--bg-dark); border: none; padding: 10px 20px; 
            border-radius: 4px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        button.action-btn:hover { background: var(--ovrin-red); color: white; }

        footer { text-align: center; padding: 4rem 1rem; background-color: #030303; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <nav>
        <a href="#"><img src="logo.png" alt="Ovrin" id="nav-logo" onerror="this.style.display='none';"></a>
        <div style="font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">The Lookbook</div>
    </nav>

    <div class="marquee-container">
        <div class="marquee-content">
            <span>Wear Your Story</span> • <span>Est. 2025</span> • <span>Premium Custom Apparel</span> • 
            <span>Wear Your Story</span> • <span>Est. 2025</span> • <span>Premium Custom Apparel</span> •
            <span>Wear Your Story</span> • <span>Est. 2025</span> • <span>Premium Custom Apparel</span>
        </div>
    </div>

    <main class="container">
        <section class="hero">
            <h1>Official <span class="highlight">Drops.</span></h1>
            <p style="color: var(--text-muted);">The latest apparel designed with intent.</p>
        </section>

        <section id="lookbook-grid" class="products">
            <div class="loader"><div class="spinner"></div></div>
        </section>
    </main>

    <footer>
        <h2 style="letter-spacing: 4px; margin-bottom: 1rem;">OVRIN</h2>
        <p class="highlight" style="font-size: 0.9rem;">WEAR YOUR STORY.</p>
    </footer>

    <!-- Script to Fetch the CMS Data -->
    <script>
        async function loadDrops() {
            const container = document.getElementById('lookbook-grid');
            try {
                // Fetch the master catalog file created by the CMS
                // We add a timestamp to force the browser to always get the newest drops
                const response = await fetch(`/content/lookbook.json?v=${new Date().getTime()}`);
                
                if (!response.ok) throw new Error('Catalog file not found yet');
                
                const data = await response.json();
                const products = data.items || [];
                
                if (products.length === 0) throw new Error('No items in catalog');

                container.innerHTML = ''; // Remove the loading spinner

                products.forEach((product, index) => {
                    // 1. Format the Badges
                    let badgeHtml = product.badge ? `<div class="badge">${product.badge}</div>` : '';
                    
                    // 2. Format the Image Path
                    let imgPath = product.image ? product.image : 'https://via.placeholder.com/400x500?text=Image+Not+Found';
                    if (imgPath && !imgPath.startsWith('http') && !imgPath.startsWith('/')) {
                        imgPath = '/' + imgPath; // Ensures the image path is perfectly linked
                    }

                    // 3. Format the Sizes
                    let sizesHtml = '';
                    if (product.sizes && Array.isArray(product.sizes)) {
                        product.sizes.forEach(size => {
                            sizesHtml += `<div class="size-box">${size}</div>`;
                        });
                    }

                    // 4. Build the HTML Card
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.style.animationDelay = `${index * 0.15}s`; // Staggered loading effect
                    card.innerHTML = `
                        ${badgeHtml}
                        <div class="image-container">
                            <img src="${imgPath}" alt="${product.title}">
                        </div>
                        <div class="product-info">
                            <h3>${product.title || 'Untitled Drop'}</h3>
                            <div class="fit-tag">${product.fit || ''}</div>
                            <div class="sizes">${sizesHtml}</div>
                            <div class="price-row">
                                <span class="price">${product.price || ''}</span>
                                <button class="action-btn">Order Now</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<h3 style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-weight: 400;">Awaiting syndicate uploads...</h3>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadDrops);
    </script>
</body>
</html>
